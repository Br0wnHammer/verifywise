name: Release images CI test (temporary, delete before merge)

# Every image is built once per architecture on a native runner (arm64 on
# ubuntu-24.04-arm, not under QEMU emulation), all in parallel. Each build is
# pushed by digest only, with no tag. The publish job then joins the two
# digests of an image into one multi-arch manifest and tags it, so no release
# tag exists until every image has been built and scanned.
#
# deploy-to-production.yml triggers on a successful run of this workflow by
# name. Keep the name, and keep this file free of non-release triggers.

on:
  push:
    branches: [ci/native-arm-parallel-release]

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract Tag Name
        id: tag
        run: echo "tag=ci-test" >> "$GITHUB_OUTPUT"


  build:
    needs: preflight
    name: Build ${{ matrix.image.name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    environment: Build

    permissions:
      contents: read
      packages: write
      security-events: write

    strategy:
      fail-fast: true
      matrix:
        arch: [amd64, arm64]
        image:
          - name: frontend
            context: .
            file: ./Clients/Dockerfile
            sarif-category: container-frontend
          - name: backend
            context: .
            file: ./Servers/Dockerfile
            sarif-category: container-backend
          - name: eval-server
            context: .
            file: ./EvalServer/Dockerfile
            sarif-category: container-evalserver
          - name: ai-gateway
            context: ./AIGateway
            file: ./AIGateway/Dockerfile
            sarif-category: container-aigateway

    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/verifywise-${{ matrix.image.name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Copy version.json into Servers context
        if: matrix.image.name == 'backend'
        run: cp version.json Servers/version.json

      - name: Remove unnecessary files
        if: matrix.image.name == 'eval-server'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      # Only the frontend takes build args.
      - name: Set build args
        id: args
        env:
          SLACK_CLIENT_ID: ${{ secrets.SLACK_CLIENT_ID }}
        run: |
          {
            echo "value<<EOF"
            if [ "${{ matrix.image.name }}" = frontend ]; then
              echo "VITE_SLACK_CLIENT_ID=$SLACK_CLIENT_ID"
              echo "VITE_APP_VERSION=$TAG"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The amd64 image is scanned, as before. The push build below reuses
      # this build's layers from the same builder.
      - name: Build image for scanning
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/amd64
          push: false
          load: true
          tags: verifywise-${{ matrix.image.name }}:scan
          build-args: ${{ steps.args.outputs.value }}

      - name: Scan image with Trivy
        if: matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: verifywise-${{ matrix.image.name }}:scan
          format: 'sarif'
          output: ${{ matrix.image.name }}-trivy-results.sarif
          severity: 'CRITICAL,HIGH'
          # Fail the release on fixable CRITICAL/HIGH vulnerabilities.
          exit-code: '1'
          ignore-unfixed: true
          limit-severities-for-sarif: 'true'

      - name: Upload Trivy scan results to GitHub Security
        if: matrix.arch == 'amd64'
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ matrix.image.name }}-trivy-results.sarif
          category: ${{ matrix.image.sarif-category }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.file }}
          platforms: linux/${{ matrix.arch }}
          build-args: ${{ steps.args.outputs.value }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ matrix.image.name }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [preflight, build]
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        image: [frontend, backend, eval-server, ai-gateway]

    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/verifywise-${{ matrix.image }}

    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create multi-arch manifest and tag it
        working-directory: /tmp/digests
        run: |
          count=$(ls | wc -l)
          if [ "$count" -ne 2 ]; then
            echo "::error::Expected 2 digests (amd64, arm64) for $IMAGE, found $count"
            exit 1
          fi
          docker buildx imagetools create \
            -t "$IMAGE:$TAG" \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Verify both architectures are in the tag
        run: |
          platforms=$(docker buildx imagetools inspect "$IMAGE:$TAG" --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
          echo "$IMAGE:$TAG platforms: $platforms"
          for p in linux/amd64 linux/arm64; do
            if ! grep -q "$p" <<< "$platforms"; then
              echo "::error::$IMAGE:$TAG is missing $p"
              exit 1
            fi
          done
